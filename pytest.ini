[pytest]
# pytest configuration for VideoFlow/DuplicateFinder test suite

# Test discovery paths
testpaths = tests

# Test file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Command line options
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    -ra
    --color=yes

# Markers for test categorization
markers =
    critical: marks tests for critical errors that block functionality (deselect with '-m "not critical"')
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    ui: marks tests that involve UI components (may require Qt)
    database: marks tests that require database access
    duplicateflow: marks tests specific to DuplicateFlow integration

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (if pytest-cov is installed)
# Run with: pytest --cov=src/plugins/duplicate_finder --cov-report=html
# [coverage:run]
# source = src/plugins/duplicate_finder
# omit =
#     */tests/*
#     */ui/*

# Test output
console_output_style = progress

# Minimum Python version
minversion = 3.8
