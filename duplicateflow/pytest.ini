[pytest]
# Pytest configuration for DuplicateFlow

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Coverage configuration
addopts =
    -v
    --strict-markers
    --cov=duplicateflow
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Markers
markers =
    unit: Unit tests (fast, no I/O)
    integration: Integration tests (slower, may use I/O)
    slow: Slow tests

# Minimum coverage per module
[coverage:run]
source = duplicateflow
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
